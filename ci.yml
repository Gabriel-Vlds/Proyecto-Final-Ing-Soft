name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov bandit

      - name: Correr tests con cobertura
        env:
          JWT_SECRET_KEY: clave-secreta-solo-para-ci
        run: |
          mkdir -p reports
          pytest --cov=. --cov-report=html:reports/coverage --cov-report=term -q test_app.py | tee reports/pytest-resultado.txt

      - name: Análisis de seguridad con Bandit
        run: |
          bandit -r . -x ./reports,./.github -f html -o reports/bandit-security-report.html || true

      - name: Subir reportes como artifact
        uses: actions/upload-artifact@v4
        with:
          name: reportes-ci
          path: reports/
